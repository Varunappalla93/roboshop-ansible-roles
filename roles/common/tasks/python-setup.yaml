- name: install python
  ansible.builtin.dnf:
    name:
      - python3
      - python3-devel
      - python3-pip
      - python3-packaging
    state: present

- name: install dependencies
  ansible.builtin.pip:
    requirements: requirements.txt
    executable: pip3.12
  args:
    chdir: /app

