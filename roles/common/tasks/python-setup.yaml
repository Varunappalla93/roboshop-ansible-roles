- name: install python
  ansible.builtin.dnf:
    name:
      - python3
      - python3-devel
    state: present

- name: install packaging python library
  ansible.builtin.dnf:
    name: python3-packaging
    state: present

- name: install dependencie
  ansible.builtin.pip:
    requirements: requirements.txt
    executable: pip3.9
  args:
    chdir: /app
